name: CI & Deploy

# PR·push 에서 lint+test 를 돌리고, main 에 머지될 때만 두 서비스를 배포한다.
# 배포는 lint·test 통과에 의존한다(needs). 인증: Workload Identity Federation(장기 키 없음).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PROJECT_ID: boj-code-review-2024
  REGION: asia-northeast3

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.15.22
      - run: ruff check .

  lint-js:
    name: Lint (JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 빌드 스텝이 없어 JS 는 브라우저에서만 파싱된다 — 구문 오류가 배포로 나간다.
      - name: 구문 검사
        run: node --check static/js/*.js
      # 스크립트가 전역 렉시컬 스코프를 공유하므로 최상위 const/let/class 이름이 겹치면
      # 전체 스크립트가 SyntaxError 로 죽는다(앱 전체 무음 실패의 단일 지점).
      - name: 최상위 선언 중복 검사
        run: |
          dupes=$(grep -hoE "^(const|let|var|class|function|async function)[[:space:]]+[A-Za-z_$][A-Za-z0-9_$]*" static/js/*.js                   | awk '{print $NF}' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "최상위 선언이 중복됩니다 — 전역 스코프를 공유하므로 전체 스크립트가 죽습니다:"
            echo "$dupes"
            exit 1
          fi
          echo "중복 없음"

  test:
    name: Test (${{ matrix.dialect }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dialect: [sqlite, postgres]
    services:
      # 두 매트릭스 다리에서 항상 뜨지만 sqlite 다리에선 놀고 있을 뿐(무해).
      # 이미지 major 는 운영 Cloud SQL(POSTGRES_15)과 일치시킨다.
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Run tests
        env:
          DB_TYPE: ${{ matrix.dialect }}
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: test
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: pytest -q

  deploy:
    name: Deploy ${{ matrix.service }}
    needs: [lint, lint-js, test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: algo-review          # 운영: 기존 env 유지
            extra_args: ""
          - service: algo-review-demo      # 데모: mock 모드
            # DB_PATH: 데모는 컨테이너 임시 SQLite 를 쓰는데 컨테이너가 non-root 라
            # 기본 경로(/app)에 쓸 수 없다. /tmp 는 쓰기 가능하고 어차피 기동마다 초기화된다.
            extra_args: "--set-env-vars DEMO_MODE=true,DB_PATH=/tmp/demo.db"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: boj-code-review-2024
          workload_identity_provider: projects/707325519995/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@boj-code-review-2024.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy ${{ matrix.service }}
        run: gcloud run deploy ${{ matrix.service }} --source . --region "$REGION" --project "$PROJECT_ID" ${{ matrix.extra_args }} --quiet
