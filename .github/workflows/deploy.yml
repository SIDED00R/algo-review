name: CI & Deploy

# PR·push 에서 lint+test 를 돌리고, main 에 머지될 때만 세 서비스(앱·데모·실행)를 배포한다.
# 배포는 lint·test 통과에 의존한다(needs). 인증: Workload Identity Federation(장기 키 없음).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# main 에 연속 머지되면 두 배포가 경쟁하므로 직렬화한다. 그룹이 ref 단위라 PR 에도
# 적용되는데, PR 은 배포하지 않으므로 구 실행을 붙잡지 않는다.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 잡 대부분은 PR 코드를 읽고 실행하기만 한다 — 기본 토큰 권한을 읽기로 좁히고,
# 쓰기가 필요한 deploy 잡만 자기 permissions 로 올린다(레포 기본값이 read-write 여도 안전).
permissions:
  contents: read

env:
  PROJECT_ID: boj-code-review-2024
  REGION: asia-northeast3

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # 핀은 requirements-dev.txt 하나가 정본이다. 파일을 통째로 설치하면 -r requirements.txt
      # 까지 딸려오므로 핀 한 줄만 뽑아 쓴다.
      - run: pip install "$(grep -E '^ruff==' requirements-dev.txt)"
      - run: ruff check .

  lint-js:
    name: Lint (JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 빌드 스텝이 없어 JS 는 브라우저에서만 파싱된다. 검사 내용은 scripts/check_js.sh 에 둔다.
      - name: JS 정적 검사
        run: bash scripts/check_js.sh

  test:
    name: Test (${{ matrix.dialect }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dialect: [sqlite, postgres]
    services:
      # 두 매트릭스 다리에서 항상 뜨지만 sqlite 다리에선 놀고 있을 뿐(무해).
      # 이미지 major 는 운영 Cloud SQL(POSTGRES_15)과 일치시킨다.
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          # 기본 해시 대상은 requirements.txt 뿐이라, 개발 의존(pytest/ruff 핀)만 올리면
          # 캐시 키가 그대로다.
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run tests
        env:
          DB_TYPE: ${{ matrix.dialect }}
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: test
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: pytest -q

  deploy:
    name: Deploy ${{ matrix.service }}
    needs: [lint, lint-js, test]
    # ref 도 본다 — 이벤트 종류만 보면 feature 브랜치에서 workflow_dispatch 로
    # 그 브랜치 코드를 공개 운영 서비스에 배포할 수 있다(헤더 주석의 약속과 어긋남).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # 접근 정책을 명시한다 — 생략하면 gcloud 가 기존 IAM 을 그대로 둔다.
          - service: algo-review           # 운영: 공개, 기존 env 유지
            source: "."
            smoke: db
            extra_args: "--allow-unauthenticated"
          - service: algo-review-demo      # 데모: 공개, mock 모드
            source: "."
            smoke: db
            # --set-env-vars 는 치환이다. DB_PATH: 컨테이너가 non-root 라 /app 에 못 쓴다.
            # APP_URL 이 없으면 GitHub OAuth redirect 가 http://localhost:8080 으로 간다.
            extra_args: "--allow-unauthenticated --set-env-vars DEMO_MODE=true,DB_PATH=/tmp/demo.db,APP_URL=https://algo-review-demo-dqrvxahm6a-du.a.run.app"
          # 실행 전용: 앱만 호출할 수 있고, 권한이 없는 전용 SA 로 돌며, VPC 로만 나가는
          # 서브넷(NAT 없음)이라 제출 코드가 외부로 나가지 못한다. env 는 비운다 —
          # 이 컨테이너에 값이 있으면 제출 코드가 /proc/1/environ 으로 읽는다.
          - service: algo-executor
            source: "executor"
            smoke: execute
            extra_args: >-
              --no-allow-unauthenticated
              --service-account algo-executor-run@boj-code-review-2024.iam.gserviceaccount.com
              --network executor-net --subnet executor-subnet --vpc-egress all-traffic
              --clear-env-vars --memory 512Mi --cpu 1 --concurrency 1
              --max-instances 5 --timeout 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: boj-code-review-2024
          workload_identity_provider: projects/707325519995/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@boj-code-review-2024.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy ${{ matrix.service }}
        run: gcloud run deploy ${{ matrix.service }} --source ${{ matrix.source }} --region "$REGION" --project "$PROJECT_ID" ${{ matrix.extra_args }} --quiet

      - name: Resolve ${{ matrix.service }} URL
        id: url
        run: |
          echo "url=$(gcloud run services describe ${{ matrix.service }} \
                       --region "$REGION" --project "$PROJECT_ID" \
                       --format='value(status.url)')" >> "$GITHUB_OUTPUT"

  smoke:
    name: Smoke ${{ matrix.service }}
    needs: [deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: algo-review
            smoke: db
          - service: algo-review-demo
            smoke: db
          - service: algo-executor
            smoke: execute
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: boj-code-review-2024
          workload_identity_provider: projects/707325519995/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@boj-code-review-2024.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve ${{ matrix.service }} URL
        id: url
        run: |
          echo "url=$(gcloud run services describe ${{ matrix.service }} \
                       --region "$REGION" --project "$PROJECT_ID" \
                       --format='value(status.url)')" >> "$GITHUB_OUTPUT"

      # `gcloud auth print-identity-token` 은 외부 계정(WIF) 자격으로 동작하지 않는다.
      # audience 가 서비스 URL 이라 배포 뒤에야 알 수 있어 auth 를 한 번 더 탄다.
      # Cloud Run 의 invoker 판정이 email 클레임을 본다.
      - name: Mint an ID token for ${{ matrix.service }}
        id: idtoken
        uses: google-github-actions/auth@v2
        with:
          project_id: boj-code-review-2024
          workload_identity_provider: projects/707325519995/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@boj-code-review-2024.iam.gserviceaccount.com
          token_format: id_token
          id_token_audience: ${{ steps.url.outputs.url }}
          id_token_include_email: true

      - name: Smoke check ${{ matrix.service }}
        # 배포가 성공해도 서비스가 기능적으로 죽어 있을 수 있다 — server.py 는 DB 연결 실패를
        # warning 으로 넘기고 /health 는 DB 가 죽어도 200 을 준다. db 필드로 그것을 가른다.
        # 실행 서비스는 /health 가 아무것도 증명하지 못한다(의존성이 없다) — 실제로 코드를
        # 한 번 돌려 본다. algo-review(운영)의 db:ok 미달은 온디맨드 Cloud SQL 정지가 정상
        # 상태이므로 warning 으로만 남기고 실패시키지 않는다 — 나머지 서비스는 하드 실패.
        env:
          URL: ${{ steps.url.outputs.url }}
          ID_TOKEN: ${{ steps.idtoken.outputs.id_token }}
          SMOKE: ${{ matrix.smoke }}
          SERVICE: ${{ matrix.service }}
        run: |
          if [ "$SMOKE" = "execute" ]; then
            CODE=$(curl -sS -m 90 -o /tmp/run.json -w '%{http_code}' -X POST \
                     -H "Authorization: Bearer $ID_TOKEN" -H "Content-Type: application/json" \
                     -d '{"code":"print(6*7)","language":"Python 3","stdin":"","timeout_sec":5}' \
                     "$URL/run" || true)
          else
            CODE=$(curl -sS -m 30 -o /tmp/run.json -w '%{http_code}' \
                     -H "Authorization: Bearer $ID_TOKEN" "$URL/health" || true)
          fi
          if [ -z "$CODE" ] || [ "$CODE" = "000" ]; then
            echo "::error::$URL 호출 자체가 실패했습니다(타임아웃/DNS 등)"
            exit 1
          fi
          BODY=$(cat /tmp/run.json 2>/dev/null || echo "")
          echo "$CODE $BODY"
          # 403 을 "DB 이상" 으로 보고하면 엉뚱한 곳을 뒤지게 된다 — 원인을 갈라 준다.
          if [ "$CODE" = "401" ] || [ "$CODE" = "403" ]; then
            echo "::error::$URL 호출이 $CODE — 배포 SA 에 run.routes.invoke 가 있는지 확인하세요"
            exit 1
          fi
          if [ "$CODE" != "200" ]; then
            echo "::error::$URL 호출이 $CODE"
            exit 1
          fi
          if [ "$SMOKE" = "execute" ]; then
            echo "$BODY" | grep -q '"stdout":"42' || {
              echo "::error::$URL/run 이 코드를 실행하지 못했습니다"
              exit 1
            }
          else
            if echo "$BODY" | grep -q '"db":"ok"'; then
              :
            elif [ "$SERVICE" = "algo-review" ]; then
              echo "::warning::$URL/health 가 db:ok 를 주지 않습니다 — 온디맨드 Cloud SQL 정지 중이면 정상입니다"
            else
              echo "::error::$URL/health 가 db:ok 를 주지 않습니다 — DB 연결·env 를 확인하세요"
              exit 1
            fi
          fi

  verify-execute:
    name: Verify 예제 실행 (운영)
    needs: [deploy]
    # 서비스별 스모크는 각자 살아 있는 것만 본다 — 앱이 실행 서비스를 실제로 호출하는지는
    # 여기서만 드러난다.
    #
    # deploy 잡의 결론만 보지 않는다(!cancelled) — smoke 잡의 결과와는 별개로 이 검증이
    # 돈다(예: algo-review 의 db:ok 미달은 smoke 에서 warning 일 뿐 실패가 아니다). deploy
    # 잡 자체가 스킵되면(lint·test 실패로 배포가 아예 없었던 경우) 검증할 배포가 없으므로
    # 함께 스킵한다.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.deploy.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: boj-code-review-2024
          workload_identity_provider: projects/707325519995/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@boj-code-review-2024.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: 운영 앱에서 예제를 실행해 본다
        run: |
          URL=$(gcloud run services describe algo-review \
                  --region "$REGION" --project "$PROJECT_ID" --format='value(status.url)')
          CODE=$(curl -sS -m 120 -o /tmp/exec.json -w '%{http_code}' -X POST \
                   -H "Content-Type: application/json" \
                   -d '{"code":"w=int(input())\nprint(\"YES\" if w>2 and w%2==0 else \"NO\")","language":"Python 3","stdin":"8","timeout_sec":5}' \
                   "$URL/api/execute")
          BODY=$(cat /tmp/exec.json)
          echo "$CODE $BODY"
          [ "$CODE" = "200" ] || { echo "::error::$URL/api/execute 가 $CODE — 예제 실행이 죽었습니다"; exit 1; }
          echo "$BODY" | grep -q '"stdout":"YES' || {
            echo "::error::예제 실행 결과가 기대와 다릅니다"
            exit 1
          }
