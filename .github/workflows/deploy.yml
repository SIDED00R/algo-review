name: CI & Deploy

# PR·push 에서 lint+test 를 돌리고, main 에 머지될 때만 두 서비스를 배포한다.
# 배포는 lint·test 통과에 의존한다(needs). 인증: Workload Identity Federation(장기 키 없음).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# main 에 연속 머지되면 두 배포가 경쟁해 나중 커밋이 먼저 끝날 수 있다 — 직렬화한다.
# 그런데 그룹이 ref 단위라 PR 에도 적용된다. PR 은 배포하지 않으므로 구 실행을 붙잡을
# 이유가 없다 — 붙잡으면 연속 push 때 직렬 대기로 CI 분만 쓴다.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 잡 대부분은 PR 코드를 읽고 실행하기만 한다 — 기본 토큰 권한을 읽기로 좁히고,
# 쓰기가 필요한 deploy 잡만 자기 permissions 로 올린다(레포 기본값이 read-write 여도 안전).
permissions:
  contents: read

env:
  PROJECT_ID: boj-code-review-2024
  REGION: asia-northeast3

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # 핀은 requirements-dev.txt 하나가 정본이다 — 여기에 버전을 복제하면
      # requirements-dev 만 올렸을 때 CI 가 조용히 구버전으로 린트한다.
      # 파일을 통째로 설치하면 -r requirements.txt 까지 딸려와 린트 잡이 느려지므로
      # 핀 한 줄만 뽑아 쓴다.
      - run: pip install "$(grep -E '^ruff==' requirements-dev.txt)"
      - run: ruff check .

  lint-js:
    name: Lint (JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 빌드 스텝이 없어 JS 는 브라우저에서만 파싱된다 — 구문 오류가 배포로 나간다.
      # 검사 내용은 scripts/check_js.sh 에 둔다(로컬에서도 같은 검사를 돌릴 수 있고,
      # 한 줄 인라인으로 두면 `node --check` 에 glob 을 넘겨 첫 파일만 검사되는 함정에 빠진다).
      - name: JS 정적 검사
        run: bash scripts/check_js.sh

  test:
    name: Test (${{ matrix.dialect }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dialect: [sqlite, postgres]
    services:
      # 두 매트릭스 다리에서 항상 뜨지만 sqlite 다리에선 놀고 있을 뿐(무해).
      # 이미지 major 는 운영 Cloud SQL(POSTGRES_15)과 일치시킨다.
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          # 기본 해시 대상은 requirements.txt 뿐이라, 개발 의존(pytest/ruff 핀)만 올리면
          # 캐시 키가 그대로다.
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run tests
        env:
          DB_TYPE: ${{ matrix.dialect }}
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: test
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: pytest -q

  deploy:
    name: Deploy ${{ matrix.service }}
    needs: [lint, lint-js, test]
    # ref 도 본다 — 이벤트 종류만 보면 feature 브랜치에서 workflow_dispatch 로
    # 그 브랜치 코드를 공개 운영 서비스에 배포할 수 있다(헤더 주석의 약속과 어긋남).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # --no-allow-unauthenticated / --allow-unauthenticated 를 명시한다. 생략하면
          # 기존 서비스의 IAM 정책을 "보존" 하므로, 누가 콘솔에서 공개로 바꿔도 배포가
          # 되돌리지 않는다. 접근 정책은 코드가 정본이어야 한다.
          #
          # 운영은 비공개다. 이 앱에는 인증이 없고 scope=repo GitHub 토큰을 들고 있어,
          # 공개면 URL 을 아는 누구나 그 토큰으로 저장소에 커밋하고 유료 LLM 을 호출할 수 있다.
          - service: algo-review          # 운영: 기존 env 유지 + 비공개
            extra_args: "--no-allow-unauthenticated"
          - service: algo-review-demo      # 데모: mock 모드 + 공개
            # DB_PATH: 데모는 컨테이너 임시 SQLite 를 쓰는데 컨테이너가 non-root 라
            # 기본 경로(/app)에 쓸 수 없다. /tmp 는 쓰기 가능하고 어차피 기동마다 초기화된다.
            # --set-env-vars 는 **치환**이다 — 여기 적힌 둘 외에 콘솔에서 추가한 env 는
            # 다음 배포에서 사라진다. 데모 서비스의 설정 정본이 이 줄이라는 뜻이다.
            #
            # 데모는 공개로 둔다. DEMO_MODE 가 쓰기·과금·코드 실행을 전부 차단하고
            # DB 는 컨테이너 임시 파일이라 잃을 것이 없다.
            extra_args: "--allow-unauthenticated --set-env-vars DEMO_MODE=true,DB_PATH=/tmp/demo.db"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: boj-code-review-2024
          workload_identity_provider: projects/707325519995/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@boj-code-review-2024.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy ${{ matrix.service }}
        run: gcloud run deploy ${{ matrix.service }} --source . --region "$REGION" --project "$PROJECT_ID" ${{ matrix.extra_args }} --quiet

      - name: Smoke check ${{ matrix.service }}
        # 배포가 성공해도 서비스가 기능적으로 죽어 있을 수 있다 — server.py 는 DB 연결
        # 실패를 warning 한 줄로 넘기고 기동을 계속하고, /health 는 DB 가 죽어도 200 을
        # 준다(둘 다 온디맨드 DB 를 위한 의도된 설계다). 그래서 리비전은 Ready 가 되고
        # 워크플로는 초록인데 사용자만 503 을 본다. /health 의 db 필드로 그것을 가른다.
        run: |
          URL=$(gcloud run services describe ${{ matrix.service }} \
                  --region "$REGION" --project "$PROJECT_ID" --format='value(status.url)')
          # 운영은 비공개라 익명 호출이 403 이다 — 배포 SA 의 ID 토큰으로 부른다.
          TOKEN=$(gcloud auth print-identity-token)
          BODY=$(curl -sS -m 30 -H "Authorization: Bearer $TOKEN" "$URL/health")
          echo "$BODY"
          echo "$BODY" | grep -q '"db":"ok"' || {
            echo "::error::$URL/health 가 db:ok 를 주지 않습니다 — DB 연결·env 를 확인하세요"
            exit 1
          }
